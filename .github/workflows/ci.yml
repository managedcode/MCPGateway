name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      benchmark-matrix: ${{ steps.benchmark-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ManagedCode.MCPGateway.slnx

      - name: Build
        run: dotnet build ManagedCode.MCPGateway.slnx --configuration Release --no-restore

      - name: Analyze
        run: dotnet build ManagedCode.MCPGateway.slnx --configuration Release --no-restore -p:RunAnalyzers=true

      - name: Verify formatting
        run: dotnet format ManagedCode.MCPGateway.slnx --verify-no-changes

      - name: Roslynator
        run: dotnet tool run roslynator analyze src/ManagedCode.MCPGateway/ManagedCode.MCPGateway.csproj tests/ManagedCode.MCPGateway.Tests/ManagedCode.MCPGateway.Tests.csproj

      - name: Test
        run: dotnet test --solution ManagedCode.MCPGateway.slnx --configuration Release --no-build --verbosity normal --report-trx --results-directory ./artifacts/test-results

      - name: Collect coverage
        run: |
          mkdir -p artifacts/coverage
          printf '|%s/=/_/\n' "$GITHUB_WORKSPACE" > artifacts/coverage/source-roots-mappings.txt
          dotnet tool run coverlet tests/ManagedCode.MCPGateway.Tests/bin/Release/net10.0/ManagedCode.MCPGateway.Tests.dll --target "./tests/ManagedCode.MCPGateway.Tests/bin/Release/net10.0/ManagedCode.MCPGateway.Tests" --targetargs "" --format cobertura --output artifacts/coverage/coverage.cobertura.xml --source-mapping-file artifacts/coverage/source-roots-mappings.txt --include "[ManagedCode.MCPGateway]*" --threshold 85 --threshold-type line --threshold-stat total

      - name: Render coverage report
        run: dotnet tool run reportgenerator -reports:"artifacts/coverage/coverage.cobertura.xml" -targetdir:"artifacts/coverage-report" -reporttypes:"HtmlSummary;MarkdownSummaryGithub"

      - name: Discover benchmark shards
        id: benchmark-matrix
        shell: bash
        run: |
          matrix=$(dotnet benchmarks/ManagedCode.MCPGateway.Benchmarks/bin/Release/net10.0/ManagedCode.MCPGateway.Benchmarks.dll --ci-matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results/**
          retention-days: 5

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ./artifacts/coverage/**
            ./artifacts/coverage-report/**
          retention-days: 5

  benchmarks:
    name: Benchmarks (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-test.outputs.benchmark-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ManagedCode.MCPGateway.slnx

      - name: Run and verify benchmark shard
        env:
          BENCHMARK_SHARD: ${{ matrix.shard }}
        run: dotnet run -c Release --no-restore --project benchmarks/ManagedCode.MCPGateway.Benchmarks/ManagedCode.MCPGateway.Benchmarks.csproj -- --ci-shard "$BENCHMARK_SHARD" ./artifacts/benchmarks

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.shard }}
          path: ./artifacts/benchmarks/**
          retention-days: 14
